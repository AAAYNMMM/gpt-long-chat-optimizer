<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPT 长聊加速器</title>
    <link rel="icon" type="image/png" href="icons/icon-16.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div>
          <h1>长聊加速器</h1>
          <p>让超长 GPT 会话重新顺滑</p>
        </div>
        <label class="switch" title="启用或暂停">
          <input id="enabled" type="checkbox">
          <span class="switch-track"></span>
          <span class="sr-only">启用优化</span>
        </label>
      </header>

      <section class="status-card" aria-live="polite">
        <div>
          <span id="status-dot" class="status-dot"></span>
          <strong id="status-title">正在连接…</strong>
        </div>
        <p id="status-detail">读取当前页面状态</p>
        <div class="stats">
          <div>
            <strong id="turn-count">—</strong>
            <span>会话消息</span>
          </div>
          <div>
            <strong id="frozen-count">—</strong>
            <span>离屏消息</span>
          </div>
          <div>
            <strong id="chunk-count">—</strong>
            <span>思考旧段</span>
          </div>
        </div>
      </section>

      <section class="recovery-card" aria-labelledby="recovery-title">
        <div>
          <strong id="recovery-title">页面救援</strong>
          <span id="recovery-state">正在检测页面状态</span>
        </div>
        <p>
          卡死或连接错误时，用新标签页重开对话并休眠旧页。
        </p>
        <button id="rescue-reopen" class="rescue-button" type="button">
          救援重开当前对话
        </button>
        <small id="recovery-result">旧页会保留；未发送内容可能无法恢复。</small>
      </section>

      <fieldset class="mode-fieldset">
        <legend>优化强度</legend>
        <label class="mode-option">
          <input type="radio" name="mode" value="safe">
          <strong>稳妥</strong>
          <small>长回复约 24 段 · 会话 60 条</small>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="balanced">
          <strong>均衡</strong>
          <small>长回复约 12 段 · 会话 30 条</small>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="strong">
          <strong>强力</strong>
          <small>长回复约 8 段 · 会话 16 条</small>
        </label>
      </fieldset>

      <button id="reveal-all" class="secondary-button" type="button">
        暂时显示全部内容（30 秒）
      </button>

      <p class="privacy-note">
        仅调整页面渲染，不读取、保存或上传聊天文本。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
